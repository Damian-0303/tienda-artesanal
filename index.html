<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="./js/main.js"></script>
    <title>Rosina Creaciones</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>

    <header>
    <h1>Rosina Creaciones</h1>
    </header>

    <main>

    <button id="btnAdministracion">
      
      ⚙ Administración

    </button>

    <div id="panelAdministracion" hidden>

    <h2>Agregar Producto</h2>

    <p id="mensajeFormulario"></p>

    <label for="nombreProducto">Nombre del producto</label>
    <input id="nombreProducto" type="text" placeholder="Nombre del producto" />
     
    <label for="precioProducto">Precio</label>
    <input id="precioProducto" type="number" placeholder="Precio" />

    <label for="cantidadDisponible">Cantidad disponible</label>
    <input id="cantidadDisponible" type="number" placeholder="Cantidad Disponible" />
     
    <label for="categoriaProducto">Categoría</label>
    <select name="Categoria" id="categoriaProducto">
      <option value="Accesorios">Accesorios</option>
      <option value="Decoración">Decoración</option>
      <option value="Hogar">Hogar</option>
    </select>

    <button id="btnAgregarProducto">Agregar producto</button>

    </div>
     <div class="tienda">
      <section class="catalogo">
        <h2>Nuestros productos</h2>
        <label for="buscadorProductos">Buscar productos</label>
        <input type="text"
        id="buscadorProductos"
        placeholder="Buscar productos...">
        
    <div id="contenedor-items"></div>
    </section>
    
    <aside class="lista-deseos">
    <h2>Mi lista de deseos</h2>
    <div id="contenedor-deseos"></div>
    </aside>

  </div>

  </main>
  </body>
</html>
